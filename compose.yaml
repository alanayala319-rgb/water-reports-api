services:
  api:
    image: ${DOCKER_IMAGE:?Define DOCKER_IMAGE en el archivo .env}
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:?Define DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:?Define DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
